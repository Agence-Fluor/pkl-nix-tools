name: Pkl Nix tools package

on:
  push:
    branches: ["**"]
    tags: ["pkl-nix-tools@*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: cachix/install-nix-action@v31
      - name: Check package version and dependency lock
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/pkl-nix-tools@* ]]; then
            version=$(pkl eval --no-project -x 'package.version' PklProject)
            test "$TAG" = "pkl-nix-tools@$version"
          fi
          pkl project resolve
          git diff --exit-code -- PklProject.deps.json
      - name: Test wrapper and packaged Pkl import
        run: sh scripts/test-package.sh
      - name: Check self-hosted flake against published pkl-nix
        run: |
          pkl eval flake.pkl > /tmp/pkl-nix-tools-flake.nix
          nix-instantiate --parse /tmp/pkl-nix-tools-flake.nix >/dev/null
      - name: Build Pkl package
        run: sh scripts/package-pkl.sh dist/package
      - uses: actions/upload-artifact@v7
        with:
          name: pkl-nix-tools-package
          path: dist/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pkl-nix-tools@')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: pkl-nix-tools-package
          path: dist/package
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(pkl eval --no-project -x 'package.version' PklProject)
          test "$TAG" = "pkl-nix-tools@$version"
      - name: Publish Pkl package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#pkl-nix-tools@}
          gh release create "$TAG" \
            "dist/package/pkl-nix-tools@$version" \
            "dist/package/pkl-nix-tools@$version.sha256" \
            "dist/package/pkl-nix-tools@$version.zip" \
            "dist/package/pkl-nix-tools@$version.zip.sha256" \
            --verify-tag --generate-notes
